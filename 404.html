<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#000000">
<title>ZAETTA - Pagina no encontrada</title>
<link rel="icon" href="assets/seguire-cover.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
  }

  .not-found {
    width: min(100%, 560px);
    text-align: center;
    padding: 42px 24px;
    border: 1px solid rgba(57,255,99,.16);
    border-radius: 28px;
    background: linear-gradient(180deg,#090909,#020202);
    box-shadow: 0 25px 70px rgba(0,0,0,.8), 0 0 24px rgba(57,255,99,.06);
  }

  .not-found h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(4rem, 18vw, 7rem);
    line-height: .9;
    letter-spacing: 4px;
  }

  .not-found p {
    max-width: 360px;
    margin: 12px auto 24px;
    color: #999;
    font-size: .95rem;
    line-height: 1.5;
  }

  .not-found a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 24px;
    border-radius: 999px;
    background: var(--green);
    color: #000;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: .82rem;
    letter-spacing: 2px;
    text-decoration: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main class="not-found">
    <h1>404</h1>
    <p>Esta pagina no existe o el enlace cambio. Vuelve al sitio oficial de ZAETTA.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
